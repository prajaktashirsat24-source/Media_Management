<!DOCTYPE html>
<html>
<head>
    <title>Add Video</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            color: #1f3c88;
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 22px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .btn {
            background: #1f3c88;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .btn:hover {
            background: #162d68;
        }

        .back {
            display: inline-block;
            margin-left: 10px;
            padding: 12px 22px;
            background: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Add Video</h1>

    <form method="POST">

        <label>Video URL</label>
        <input
            type="url"
            name="video_url"
            placeholder="https://www.youtube.com/watch?v=..."
            required
        >

        <label>Description</label>
        <input
            type="text"
            name="description"
            placeholder="Enter video description"
        >

        <button type="submit" class="btn">
            Add Video
        </button>

        <a href="/dashboard" class="back">
            Dashboard
        </a>

    </form>

</div>

</body>
</html>
