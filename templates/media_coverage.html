<!DOCTYPE html>
<html>
<head>
    <title>Media Coverage</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 850px;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
            color: #1f3c88;
            margin-bottom: 30px;
        }

        .top-buttons {
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 7px;
            text-decoration: none;
            color: white;
            margin-right: 8px;
        }

        .add {
            background: #198754;
        }

        .dashboard {
            background: #1f3c88;
        }

        .card {
            background: white;
            padding: 22px;
            margin-bottom: 18px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .card h2 {
            color: #1f3c88;
            margin-top: 0;
        }

        .card a {
            color: #0d6efd;
            word-break: break-all;
        }

        .actions {
            margin-top: 18px;
        }

        .edit {
            background: #1f3c88;
        }

        .delete {
            background: #dc3545;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Media Coverage</h1>

    <div class="top-buttons">
        <a href="/add-media-coverage" class="btn add">
            + Add Media Coverage
        </a>

        <a href="/dashboard" class="btn dashboard">
            Dashboard
        </a>
    </div>

    {% for coverage in coverages %}

    <div class="card">

        <h2>{{ coverage[1] }}</h2>

        <p>
            <strong>Media URL:</strong><br>
            <a href="{{ coverage[2] }}" target="_blank">
                {{ coverage[2] }}
            </a>
        </p>

        <div class="actions">

            <a href="/edit-media-coverage/{{ coverage[0] }}"
               class="btn edit">
                Edit
            </a>

            <a href="/delete-media-coverage/{{ coverage[0] }}"
               class="btn delete"
               onclick="return confirm('Are you sure you want to delete this media coverage?');">
                Delete
            </a>

        </div>

    </div>

    {% else %}

    <div class="card">
        <p>No media coverage available.</p>
    </div>

    {% endfor %}

</div>

</body>
</html>
