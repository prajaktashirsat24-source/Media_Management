<!DOCTYPE html>
<html>
<head>
    <title>Edit Media Coverage</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 500px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #1f3c88;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1f3c88;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #162d66;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            text-decoration: none;
            color: #1f3c88;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Edit Media Coverage</h1>

    <form method="POST">

        <label>Title</label>

        <input
            type="text"
            name="title"
            value="{{ coverage[1] }}"
            required
        >

        <label>URL</label>

        <input
            type="url"
            name="url"
            value="{{ coverage[2] }}"
            required
        >

        <button type="submit">
            Update Media Coverage
        </button>

    </form>

    <a href="/media-coverage" class="back">
        ← Back to Media Coverage
    </a>

</div>

</body>
</html>
