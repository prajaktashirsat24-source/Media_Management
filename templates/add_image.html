<!DOCTYPE html>
<html>
<head>
    <title>Add Image</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 500px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #1f3c88;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input[type="file"],
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1f3c88;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #162d66;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            text-decoration: none;
            color: #1f3c88;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Add Image to Gallery</h1>

    <form method="POST" enctype="multipart/form-data">

        <label>Select Image</label>

        <input
            type="file"
            name="image"
            accept=".jpg,.jpeg,.png,.gif"
            required
        >

        <label>Description</label>

        <input
            type="text"
            name="description"
            placeholder="Enter image description"
        >

        <button type="submit">
            Upload Image
        </button>

    </form>

    <a href="/dashboard" class="back">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
