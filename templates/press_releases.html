<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Press Releases</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fc;
        }

        .header {
            background: #1f3c88;
            color: white;
            padding: 20px 40px;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .top-bar h2 {
            color: #1f3c88;
        }

        .add-btn,
        .back-btn {
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 7px;
            font-weight: bold;
        }

        .add-btn {
            background: #1f3c88;
            color: white;
        }

        .back-btn {
            background: #e5e7eb;
            color: #333;
        }

        .release-card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .release-card h3 {
            color: #1f3c88;
            margin-bottom: 8px;
        }

        .date {
            color: #777;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .description {
            color: #444;
            line-height: 1.6;
        }

        .empty {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 12px;
            color: #777;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Media Management System</h1>
    </div>

    <div class="container">

        <div class="top-bar">

            <h2>Press Releases</h2>

            <div>
                <a href="/add-press-release" class="add-btn">
                    + Add New
                </a>

                <a href="/dashboard" class="back-btn">
                    Dashboard
                </a>
            </div>

        </div>


        {% if releases %}

            {% for release in releases %}

                <div class="release-card">

                    <h3>{{ release[1] }}</h3>

                    <div class="date">
                        Release Date: {{ release[3] }}
                    </div>

                    <div class="description">
                        {{ release[2] }}
                    </div>

                    <div style="margin-top: 18px;">

    <a href="/edit-press-release/{{ release[0] }}"
       style="background:#1f3c88; color:white; padding:9px 15px;
              border-radius:7px; text-decoration:none; margin-right:8px;">
        Edit
    </a>

    <a href="/delete-press-release/{{ release[0] }}"
       onclick="return confirm('Are you sure you want to delete this press release?');"
       style="background:#dc3545; color:white; padding:9px 15px;
              border-radius:7px; text-decoration:none;">
        Delete
    </a>

</div>

                </div>

            {% endfor %}

        {% else %}

            <div class="empty">
                No press releases available.
            </div>

        {% endif %}

    </div>

</body>
</html>
